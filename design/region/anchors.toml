# Real places that anchor the PokéMaritimes blueprint (read by dev/blueprint.py).
#
# lat/lon: decimal degrees, approximate (good to about 2 km); enough for a blueprint.
# map:     the game map that stands for this place, if one exists. dev/blueprint.py fits the
#          corridor's maps to these anchors and reports how far each one is off.
# stage:   "built" (a map exists), "corridor" (the next development area),
#          "later" (region blueprint only; nothing is decided).
# Names are real places used as references. In-game names stay provisional (region_plan.md).

# --- The western NB corridor: HomeTown -> Woodstock -> Fredericton ---------------------------

[[anchor]]
name = "HomeTown"
lat = 46.16
lon = -67.73
map = "HomeTown_0"
stage = "built"
fit = false          # not a real place, and a start area is drawn zoomed in
label = "left"       # drawn left of its dot (Woodstock's label is to the right)
note = "Provisional spot: the Meduxnekeag hills between Woodstock and the Maine border (about 10 km). Not a real town."

[[anchor]]
name = "Woodstock"
lat = 46.152
lon = -67.598
map = "Woodstock_2"
stage = "built"
note = "West bank of the Saint John, at the mouth of the Meduxnekeag."

[[anchor]]
name = "Hartland"
lat = 46.298
lon = -67.525
stage = "later"
note = "Upriver (north) of Woodstock: the world's longest covered bridge. Potato country beyond."

[[anchor]]
name = "Meductic"
lat = 45.995
lon = -67.485
stage = "corridor"
note = "Where the river ends its run south from Woodstock and swings east."

[[anchor]]
name = "Nackawic"
lat = 45.997
lon = -67.244
stage = "corridor"
note = "Mill town on the headpond's north bank; the giant axe. The Hawkshaw Bridge links it to Route 2 on the south bank."

[[anchor]]
name = "Kings Landing"
lat = 45.874
lon = -66.990
stage = "corridor"
note = "1800s heritage village on the headpond's south shore."

[[anchor]]
name = "Mactaquac Dam"
lat = 45.952
lon = -66.870
stage = "corridor"
note = "The dam that makes the headpond; the gateway to Fredericton from upriver."

[[anchor]]
name = "Fredericton"
lat = 45.964
lon = -66.643
map = "Fredericton_0"
stage = "built"
note = "Downtown (Legislature, Officers' Square) on the south bank; the Nashwaak joins from the north."

[[anchor]]
name = "Oromocto"
lat = 45.849
lon = -66.479
stage = "later"
note = "Downriver of Fredericton; the way toward Grand Lake and Saint John."

