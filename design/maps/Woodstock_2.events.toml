# Woodstock, the confluence town: its signs, townspeople and an item (provisional text).
#   dev/events.py build design/maps/Woodstock_2.events.toml [--apply]
# The terrain is design/maps/woodstock_design.py (milestone 15); every sign post is drawn there.
# Keep the walk from Route 201 down to Route 202 and up over the bridge clear: the build prints
# the route numbers.
map = "Woodstock_2"

# Beside Main Street at the highway junction, seen from both roads.
[[sign]]
name = "TownSign"
at = [24, 34]
text = """
WOODSTOCK
The town where two rivers meet.
"""

# Beside the station's front path.
[[sign]]
name = "StationSign"
at = [30, 13]
text = """
WOODSTOCK WILDLIFE STATION
Pokémon field research
"""

# In the community garden by the first house on King Street.
[[sign]]
name = "GardenSign"
at = [5, 12]
text = """
COMMUNITY GARDEN
Please share the harvest!
"""

# At the bridge's south end, by the water.
[[sign]]
name = "CreekSign"
at = [27, 31]
text = """
MEDUXNEKEAG RIVER
It joins the Saint John right here.
"""

# Where Main Street ends at the north edge of town.
[[sign]]
name = "NorthSign"
at = [24, 5]
text = """
NORTH: HARTLAND
The trail is closed past here.
"""

# Tending the flower beds beside the garden house. One Oran Berry, once.
[[person]]
name = "Gardener"
at = [12, 12]
gfx = "WOMAN_2"
facing = "up"
gift = "ITEM_ORAN_BERRY"
text = """
The berry bushes came in so well this year, there's plenty to go around.

Here, take one for your Pokémon!
"""
after = """
A Pokémon holding an Oran Berry will eat it when it gets weak in battle.
"""

# Out front of the station, by the door.
[[person]]
name = "StationWorker"
at = [34, 12]
gfx = "SCIENTIST_1"
facing = "left"
text = """
We count the Pokémon living along the river and in the woods around town.

Our field researchers go as far as the forestry village up Route 201.
"""

# Playing on the riverside green.
[[person]]
name = "Kid"
at = [33, 17]
gfx = "LITTLE_GIRL"
facing = "wander"
range = [1, 1]
text = """
I'm going to be a Pokémon researcher when I grow up!

I already know every Pokémon in the garden.
"""

# On the creek's south bank by the bridge, looking over the water.
[[person]]
name = "Angler"
at = [29, 30]
gfx = "FISHERMAN"
facing = "up"
text = """
Nothing's biting today. You need a fishing rod to catch Pokémon in the water.

The big ones stay out in the Saint John.
"""

# Beside the highway where it heads south.
[[person]]
name = "Walker"
at = [24, 38]
gfx = "MAN_3"
facing = "right"
text = """
This road heads south along the river to the city.

It's a long walk, but it's pretty this time of year.
"""

# The grassy nook by the river at the north edge of town, behind the station.
[[item]]
name = "RiverNookBall"
at = [41, 1]
item = "ITEM_POKE_BALL"
