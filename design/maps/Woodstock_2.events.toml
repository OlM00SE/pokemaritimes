# Woodstock, the river town: its signs, townspeople and an item (provisional text).
#   dev/events.py build design/maps/Woodstock_2.events.toml [--apply]
# Woodstock is Tom's hand-painted map. The town sign's post is the only terrain this spec needed:
# dev/mapgen.py patch Woodstock_2 s@9,16 (one cell). The garden and station posts are Tom's own.
# Keep the walk from Route 201 down to Route 202 clear: the build prints the route numbers.
map = "Woodstock_2"

# At the east end of the entrance road from Route 201, beside the stairs down into town.
[[sign]]
name = "TownSign"
at = [9, 16]
text = """
WOODSTOCK
The river town in the woods.
"""

# Tom's post beside the station door.
[[sign]]
name = "StationSign"
at = [19, 13]
text = """
WOODSTOCK WILDLIFE STATION
Pokémon field research
"""

# Tom's post in the garden by the first house, read from the garden path.
[[sign]]
name = "GardenSign"
at = [5, 11]
text = """
COMMUNITY GARDEN
Please share the harvest!
"""

# On the garden path, beside her plots. One Oran Berry, once.
[[person]]
name = "Gardener"
at = [6, 12]
gfx = "WOMAN_2"
facing = "left"
gift = "ITEM_ORAN_BERRY"
text = """
The berry bushes came in so well this year, there's plenty to go around.

Here, take one for your Pokémon!
"""
after = """
A Pokémon holding an Oran Berry will eat it when it gets weak in battle.
"""

# Out front of the station, in a field vest.
[[person]]
name = "StationWorker"
at = [21, 14]
gfx = "SCIENTIST_1"
facing = "down"
text = """
We count the Pokémon living along the river and in the woods around town.

Our field researchers go as far as the forestry village up Route 201.
"""

# Playing on the town green.
[[person]]
name = "Kid"
at = [15, 19]
gfx = "LITTLE_GIRL"
facing = "wander"
range = [2, 2]
text = """
I'm going to be a Pokémon researcher when I grow up!

I already know every Pokémon in the garden.
"""

# On the pond's north shore, looking over the water.
[[person]]
name = "Angler"
at = [6, 26]
gfx = "FISHERMAN"
facing = "down"
text = """
Nothing's biting today. You need a fishing rod to catch Pokémon in the water.

The big ones stay out in the river.
"""

# By the road south.
[[person]]
name = "Walker"
at = [16, 31]
gfx = "MAN_3"
facing = "right"
text = """
This road heads south along the river to the city.

It's a long walk, but it's pretty this time of year.
"""

# The grassy nook between the station and the river.
[[item]]
name = "RiverNookBall"
at = [23, 6]
item = "ITEM_POKE_BALL"
