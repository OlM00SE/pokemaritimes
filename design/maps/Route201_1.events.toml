# Route 201, the Meduxnekeag valley: its people, sign and hidden item (provisional text).
#   dev/events.py build design/maps/Route201_1.events.toml [--apply]
# Positions are map tiles [x, y]. Keep the road clear: route numbers must show no trainer a
# crossing can't avoid (the build prints them).
map = "Route201_1"

# The sign post itself is terrain: `s` at (3, 21) in route201_design.py, by the road out of HomeTown. Like vanilla's route
# signs it fits the box's two lines and points to the far end of the route.
[[sign]]
name = "RouteSign"
at = [3, 21]
text = """
ROUTE 201
{RIGHT_ARROW} WOODSTOCK
"""

# At the regrowing cutblock on the north bank, looking over the saplings.
[[person]]
name = "Forester"
at = [33, 8]
gfx = "OLD_MAN"
facing = "right"
text = """
We logged this stand a few summers back. Look at those saplings, already up to my shoulder!

Pokémon like the young woods. The tall grass between the saplings is full of them.
"""

# On the riverside trail under the meadow's ledge, facing it: jump down and you land in his
# sight. The road is on the other bank, so the battle is optional.
[[trainer]]
name = "BugCatcherRoss"
at = [7, 11]
gfx = "BUG_CATCHER"
facing = "up"
sight = 3
class = "Bug Catcher"
trainer_name = "ROSS"
party = ["Caterpie 3", "Weedle 3"]
intro = "Hey! You jumped right into my bug-catching spot!"
defeat = "Aww, my bugs got squashed..."
after = """
Bug Pokémon love the meadow up on the slope.

I come here every day after school.
"""

# Tucked in the nook east of the beaver pond.
[[hidden_item]]
name = "PondPotion"
at = [48, 4]
item = "ITEM_POTION"
