# Building stamps: whole vanilla buildings that mapgen places from a sketch (mapkit/stamps.py).
#
# Each stamp is cut from a vanilla map (`source`, top-left `at`) and copied block for block:
# metatile, collision and elevation, exactly as vanilla has them. `shape` marks which cells of
# the rectangle belong to the building ('#') and which are left to the terrain ('.'); a mat
# below a door is a '#' in an extra row. The door is found from the tiles (one WarpDoor cell).
# Stamps whose tiles all come from gTileset_General work on any map with that primary; the
# others need the source's secondary tileset (mapgen refuses them elsewhere).
#
# `interior` is the vanilla interior a placed door gets a copy of (mapkit/interiors.py), with
# its upper floors; `kind` adds what makes it work: "pokemon_center" (a nurse who heals, the
# respawn point, the cable club upstairs), "mart" (a clerk with a stock list), or "plain".
# Add a stamp by appending an entry; dev/tests/stamp_pieces.py checks every entry.

[[stamp]]
name = "pokemon_center"
about = "Pokémon Center: the nurse heals and it becomes the respawn point; the cable club upstairs"
source = "PetalburgCity"
at = [19, 13]
shape = ["####",
         "####",
         "####",
         "####"]
interior = "OldaleTown_PokemonCenter_1F"
kind = "pokemon_center"

